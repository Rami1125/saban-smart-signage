<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f97316" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle grid pattern indicating building materials / architectural grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="2">
    <line x1="64" y1="128" x2="448" y2="128" />
    <line x1="64" y1="256" x2="448" y2="256" />
    <line x1="64" y1="384" x2="448" y2="384" />
    <line x1="128" y1="64" x2="128" y2="448" />
    <line x1="256" y1="64" x2="256" y2="448" />
    <line x1="384" y1="64" x2="384" y2="448" />
  </g>

  <!-- Central Building Blocks & Smart Signal Wave -->
  <g transform="translate(256, 215)">
    <!-- Lower Left Block -->
    <rect x="-140" y="30" width="130" height="90" rx="16" fill="url(#blueGrad)" />
    <!-- Lower Right Block -->
    <rect x="10" y="30" width="130" height="90" rx="16" fill="url(#orangeGrad)" filter="url(#glow)" />
    <!-- Top Central Keystone Block -->
    <rect x="-65" y="-80" width="130" height="90" rx="16" fill="#f8fafc" />

    <!-- Radio / Smart Signage Signal Arcs -->
    <path d="M-60,-115 A 75 75 0 0 1 60,-115" fill="none" stroke="#f97316" stroke-width="12" stroke-linecap="round" />
    <path d="M-90,-145 A 115 115 0 0 1 90,-145" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" opacity="0.9" />
    <circle cx="0" cy="-90" r="8" fill="#f97316" />
  </g>

  <!-- Typography "ח. סבן" & "1994" -->
  <text x="256" y="390" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    ח. סבן
  </text>
  <text x="256" y="426" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#94a3b8" text-anchor="middle" letter-spacing="4">
    1994 • PWA
  </text>
</svg>
